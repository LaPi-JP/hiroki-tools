<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 32px;
    }
    .tool-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tool-list a {
      display: block;
      padding: 16px 32px;
      background: #fff;
      border-radius: 8px;
      text-decoration: none;
      color: #2c3e50;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tool-list a:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web Tools</h1>
    <ul class="tool-list">
      <li><a href="hearing-sheet.html">📋 Webサイト制作 ヒアリングシート</a></li>
    </ul>
  </div>
</body>
</html>
